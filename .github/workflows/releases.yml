name: Release

on:
  push:
    tags:
      - "v*.*.*"

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    container:
      image: archlinux:latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: "Install Dependencies"
        run: |
          pacman -Syu --noconfirm
          pacman -S --noconfirm base-devel git nodejs npm github-cli

          useradd -m builder
          echo "builder ALL=(ALL) NOPASSWD: ALL" >> /etc/sudoers

          sudo -u builder git clone https://aur.archlinux.org/yay.git /home/builder/yay
          cd /home/builder/yay
          sudo -u builder makepkg -si --noconfirm

          sudo -u builder yay -S --noconfirm aylurs-gtk-shell
          npm install -g sass

      - name: Build Direwolf
        run: |
          make ags-deployment

      - name: Verify build output exists
        run: |
          test -f dist/Direwolf

      - name: Rename release binary
        run: |
          cp dist/Direwolf dist/Direwolf-${{ github.ref_name }}

      - name: Create tar ball
        run: |
          tar -czf dist/Direwolf-${{ github.ref_name }}.tar.gz \
          dist/Direwolf-${{ github.ref_name }} \
          packaging/arch/direwolf \
          packaging/arch/direwolf.service \
          makefile

      - name: Create release zip
        run: |
          zip dist/Direwolf-${{ github.ref_name }}.zip \
          dist/Direwolf-${{ github.ref_name }}.tar.gz \
          packaging/arch/PKGBUILD \
          packaging/arch/direwolf.install

      - name: Create GitHub release
        working-directory: ${{ github.workspace }}
        run: |
          gh release create ${{ github.ref_name }} \
            dist/Direwolf-${{ github.ref_name }}.zip \
            --repo ${{ github.repository }} \
            --title "${{ github.ref_name }}" \
            --notes "Release of DireWolf version ${{ github.ref_name }}." \
            --generate-notes
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

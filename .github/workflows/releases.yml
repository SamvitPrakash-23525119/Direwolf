name: Release

on:
  push:
    tags:
      - "v*.*.*"

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    container:
      image: archlinux:latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: "Install Dependencies"
        run: |
          pacman -Syu --noconfirm
          pacman -S --noconfirm base-devel git nodejs npm github-cli pacman-contrib tar zip

          useradd -m builder
          echo "builder ALL=(ALL) NOPASSWD: ALL" >> /etc/sudoers

          sudo -u builder git clone https://aur.archlinux.org/yay.git /home/builder/yay
          cd /home/builder/yay
          sudo -u builder makepkg -si --noconfirm

          sudo -u builder yay -S --noconfirm aylurs-gtk-shell
          npm install -g sass

      - name: Build Direwolf
        run: |
          make ags-deployment

      - name: Verify build output exists
        run: |
          test -f dist/direwolf.ags

      - name: Rename release binary
        run: |
          cp dist/direwolf.ags dist/direwolf-${{ github.ref_name }}

      - name: Create tar ball
        run: |
          tar -czvf dist/direwolf-${{ github.ref_name }}.tar.gz \
          -C bin direwolf \
          -C ../systemd direwolf.service \
          -C ../packaging/arch makefile \
          -C ../../dist direwolf-${{ github.ref_name }}

      - name: SHA256 checksum
        working-directory: ./packaging/arch
        run: |
          updpkgsums

      - name: Create release zip
        run: |
          zip -j dist/direwolf-${{ github.ref_name }}.zip \
          test/direwolf-${{ github.ref_name }}.tar.gz \
          packaging/arch/PKGBUILD

      - name: Create GitHub release
        working-directory: ${{ github.workspace }}
        run: |
          gh release create ${{ github.ref_name }} \
            dist/direwolf-${{ github.ref_name }}.zip \
            --repo ${{ github.repository }} \
            --title "${{ github.ref_name }}" \
            --notes "Release of DireWolf version ${{ github.ref_name }}." \
            --generate-notes
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
